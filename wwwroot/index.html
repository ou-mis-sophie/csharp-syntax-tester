<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A minimal browser-based C# syntax tester for assessment use." />
    <base href="/csharp-syntax-tester/" />
    <title>C# Syntax Tester</title>
    <link rel="stylesheet" href="css/app.css" />
</head>
<body>
    <div id="app">
        <div class="loading-shell">
            <div class="loading-card">
                <h1>C# Syntax Tester</h1>
                <p>Loading syntax checker…</p>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unexpected error occurred. Reload the page and try again.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">×</a>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
